<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Komik Mlbb</title>
  <style>
    .komik {
      display: flex;
      gap: 12px;
      align-items: center;
      max-width: 400px;
      margin-bottom: 12px;
      padding: 8px;
      border: 1px solid #ccc;
    }
    .komik img {
      width: 80px;
      height: 120px;
      object-fit: cover;
    }
    .komik h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .komik a {
      display: inline-block;
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      transition: transform .1s;
    }
    .komik a:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>

  <div class="komik">
    <img src="https://i.postimg.cc/Wb4hQGrq/Lunox-X-Gloo.jpg" alt="sampul">
    <div>
      <h2>Lunox X Gloo</h2>
      <a href="https://move2link.co/0da0ff2">DOWNLOAD</a>
    </div>
  </div>

</html>
